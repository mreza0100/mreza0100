# Contribution snake — Platane/snk eats the contribution graph.
# Writes assets/snake-{dark,light}.svg on master with the default GITHUB_TOKEN.
name: snake

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7
            assets/snake-light.svg?palette=github-light&color_snake=#0969da
      - name: Commit if changed
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-*.svg
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(snake): refresh [skip ci]"
          # sibling refresh jobs push to master too; retry the rebase+push on a lost race
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i lost the race; retrying"
            sleep $((i * 7))
          done
          echo "push failed after 5 attempts" >&2
          exit 1