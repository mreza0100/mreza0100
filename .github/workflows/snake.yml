# Contribution snake — Platane/snk eats the contribution graph.
# Writes assets/snake-{dark,light}.svg on master with the default GITHUB_TOKEN.
name: snake

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7
            assets/snake-light.svg?palette=github-light&color_snake=#0969da
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-*.svg
          git diff --cached --quiet || git commit -m "chore(snake): refresh [skip ci]"
          git pull --rebase origin master
          git push
