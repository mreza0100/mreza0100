# Regenerates the self-hosted cards: the hero banner and the stats card.
# Public data only, so the default GITHUB_TOKEN is enough.
name: cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/stats.mjs
      - scripts/hero.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stats card
        run: node scripts/stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}

      - name: Generate hero banner
        run: node scripts/hero.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/hero-*.svg
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(cards): refresh hero + stats [skip ci]"
          # sibling refresh jobs push to master too; retry the rebase+push on a lost race
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i lost the race; retrying"
            sleep $((i * 7))
          done
          echo "push failed after 5 attempts" >&2
          exit 1