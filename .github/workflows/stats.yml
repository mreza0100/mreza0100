# Regenerates the self-hosted stats cards (assets/stats-*.svg) with the default GITHUB_TOKEN.
name: stats card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        run: node scripts/stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          if git diff --cached --quiet; then
            echo "cards unchanged - nothing to commit"
          else
            git commit -m "chore(stats): refresh cards [skip ci]"
            git pull --rebase origin master   # sibling bots (snake, 3d) also push to master
            git push
          fi
