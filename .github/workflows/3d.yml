# 3D isometric contribution graph — yoshi389111/github-profile-3d-contrib.
# Renders profile-3d-contrib/*.svg from public contributions with the default GITHUB_TOKEN.
name: 3d-contrib

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/3d.yml", "conf/3d-contrib.json"]

permissions:
  contents: write

concurrency:
  group: 3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/3d-contrib.json
      - name: Commit if changed
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*.svg
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(3d): refresh contribution graph [skip ci]"
          # sibling refresh jobs push to master too; retry the rebase+push on a lost race
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i lost the race; retrying"
            sleep $((i * 7))
          done
          echo "push failed after 5 attempts" >&2
          exit 1